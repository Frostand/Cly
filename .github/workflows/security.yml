name: Cly Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: cly-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Review all locked dependencies for high/critical advisories
        run: pnpm audit --audit-level high

  production-audit:
    name: production-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high

  production-licenses:
    name: production-licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm licenses:check

  secret-scan:
    name: secret-scan
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results
          upload: false
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 14

  security:
    name: security
    if: always()
    needs:
      - dependency-review
      - production-audit
      - production-licenses
      - secret-scan
      - codeql
    runs-on: ubuntu-latest
    steps:
      - name: Verify all security checks passed
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PRODUCTION_AUDIT: ${{ needs.production-audit.result }}
          PRODUCTION_LICENSES: ${{ needs.production-licenses.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
          CODEQL: ${{ needs.codeql.result }}
        run: |
          test "$DEPENDENCY_REVIEW" = "success" -o "$DEPENDENCY_REVIEW" = "skipped"
          test "$PRODUCTION_AUDIT" = "success"
          test "$PRODUCTION_LICENSES" = "success"
          test "$SECRET_SCAN" = "success"
          test "$CODEQL" = "success"
