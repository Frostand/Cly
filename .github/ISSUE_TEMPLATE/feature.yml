name: Feature
description: Propose a user-facing Cly capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Research problem
      description: What research workflow is currently difficult or untraceable?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: Provenance implications
      description: Which sources, objects, decisions, experiments, outputs, or claims must stay connected?

