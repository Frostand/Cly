#:schema https://conductor.build/schemas/settings.repo.schema.json

[scripts]
setup = """
python3 -m venv backend/.venv
backend/.venv/bin/pip install -r backend/requirements-dev.txt
npm --prefix frontend install
"""
archive = "true"
run_mode = "concurrent"

[scripts.run.app]
command = """
bash -lc '
set -e
backend_port=$((CONDUCTOR_PORT + 1))
backend/.venv/bin/uvicorn app.main:app --reload --host 127.0.0.1 --port "$backend_port" --app-dir backend &
backend_pid=$!
trap "kill $backend_pid 2>/dev/null || true" EXIT
cd frontend
NEXT_TELEMETRY_DISABLED=1 NEXT_PUBLIC_API_BASE_URL="http://127.0.0.1:$backend_port" npx next dev --hostname 127.0.0.1 --port "$CONDUCTOR_PORT"
'
"""
default = true
icon = "play"

[scripts.run.backend]
command = "backend/.venv/bin/uvicorn app.main:app --reload --host 127.0.0.1 --port \"$CONDUCTOR_PORT\" --app-dir backend"
icon = "server"

[scripts.run.frontend]
command = "cd frontend && NEXT_TELEMETRY_DISABLED=1 npx next dev --hostname 127.0.0.1 --port \"$CONDUCTOR_PORT\""
icon = "globe"

[scripts.run.test]
command = "backend/.venv/bin/python -m pytest -q backend/tests && npm --prefix frontend run typecheck"
icon = "test-tube"
