allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  msw: true
  node-pty: true
  sharp: false

supportedArchitectures:
  os:
    - current
    - darwin
  cpu:
    - x64
    - arm64

overrides:
  "@electron/asar": 4.2.1
  "@electron/universal": 3.0.6
  "app-builder-lib@26.15.3>electron-builder-squirrel-windows": "-"
  brace-expansion: 5.0.8
  dompurify: 3.4.12
  fast-uri: 3.1.4
  hono: 4.12.32
  jake: 12.10.1
  js-yaml: 4.3.0
  lodash-es: 4.18.1
  mermaid: 11.16.0
  next: 16.2.11
  postcss: 8.5.18
  sharp: 0.35.0
  tar: 7.5.21

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - node-pty
