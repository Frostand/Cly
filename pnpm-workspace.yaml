  lodash-es: 4.18.1
  postcss: 8.5.10

ignoredBuiltDependencies:
  - sharp
  - unrs-resolver

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild
  - msw
  - node-pty
