<!doctype html>
<html class="dark" data-base-color="zinc" lang="en" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cly</title>
    <meta
      name="description"
      content="Cly is a local-first research cockpit for sources, experiments, evidence, claims, provenance, and reproducibility."
    />
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      :root {
        --font-inter: "Inter", ui-sans-serif, system-ui, sans-serif;
        --font-jetbrains-mono: "JetBrains Mono", ui-monospace, monospace;
      }

      html,
      body {
        background: oklch(0.141 0.005 285.823);
        color: oklch(0.985 0 0);
        margin: 0;
        min-height: 100%;
      }

      html.light,
      html.light body {
        --background: oklch(1 0 0);
        background: oklch(1 0 0);
        color: oklch(0.145 0 0);
      }

      html.dark,
      html.dark body {
        --background: oklch(0.145 0 0);
        background: oklch(0.145 0 0);
        color: oklch(0.985 0 0);
      }

      html.dark[data-base-color="slate"],
      html.dark[data-base-color="slate"] body {
        --background: oklch(0.129 0.042 264.695);
        background: oklch(0.129 0.042 264.695);
      }

      html.dark[data-base-color="gray"],
      html.dark[data-base-color="gray"] body {
        --background: oklch(0.13 0.028 261.692);
        background: oklch(0.13 0.028 261.692);
      }

      html.dark[data-base-color="zinc"],
      html.dark[data-base-color="zinc"] body {
        --background: oklch(0.141 0.005 285.823);
        background: oklch(0.141 0.005 285.823);
      }

      html.dark[data-base-color="stone"],
      html.dark[data-base-color="stone"] body {
        --background: oklch(0.147 0.004 49.25);
        background: oklch(0.147 0.004 49.25);
      }

      #root {
        min-height: 100vh;
      }

      .boot-loading {
        align-items: center;
        background: var(--background, oklch(0.141 0.005 285.823));
        display: grid;
        inset: 0;
        justify-items: center;
        position: fixed;
        z-index: 50;
      }

      .boot-logo-wrap {
        position: relative;
      }

      .boot-logo {
        color: currentColor;
        display: block;
        height: 4rem;
        position: relative;
        width: 4rem;
        z-index: 10;
      }

      .boot-copy {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        margin-top: -4rem;
        max-width: 28rem;
        padding: 0 1.5rem;
        text-align: center;
      }

      .boot-message {
        color: color-mix(in oklab, currentColor 66%, transparent);
        font: 0.875rem/1.5 var(--font-inter);
        margin: 0;
      }

      .boot-retry {
        background: currentColor;
        border: 0;
        border-radius: 0.5rem;
        color: var(--background);
        cursor: pointer;
        display: none;
        font: 600 0.875rem/1 var(--font-inter);
        min-height: 2.5rem;
        padding: 0 1rem;
      }

      .boot-loading[data-state="failed"] .boot-retry { display: inline-flex; align-items: center; }
      .boot-sparkles-wrap {
        display: block;
        position: relative;
      }

      .boot-sparkles-child {
        align-items: center;
        display: flex;
        height: 16rem;
        justify-content: center;
        position: relative;
        width: 4rem;
        z-index: 10;
      }

      .boot-sparkles-field {
        bottom: 0;
        height: 256px;
        left: 0;
        overflow: visible;
        pointer-events: none;
        position: absolute;
        right: 0;
        z-index: 0;
      }

      .boot-loading[data-state="failed"] .boot-sparkles-field { display: none; }

      .boot-sparkles-field::after {
        animation: boot-sparkles-glow-pulse 2.4s ease-in-out infinite;
        background: radial-gradient(
          60% 100% at 50% 100%,
          rgba(255, 255, 255, 0.45),
          transparent 70%
        );
        bottom: -8px;
        content: "";
        filter: blur(10px);
        height: 50px;
        left: 6%;
        opacity: 0.9;
        position: absolute;
        right: 6%;
      }

      .boot-spark {
        animation-duration: var(--duration, 4s);
        animation-delay: var(--delay, 0s);
        animation-iteration-count: infinite;
        animation-name: boot-sparkles-rise;
        animation-timing-function: linear;
        background: transparent;
        bottom: 0;
        height: var(--size, 2px);
        position: absolute;
        width: var(--size, 2px);
        will-change: transform, opacity;
      }

      .boot-spark.boot-star {
        box-shadow:
          0 calc(var(--size) * -1) 0 var(--c),
          0 var(--size) 0 var(--c),
          calc(var(--size) * -1) 0 0 var(--c),
          var(--size) 0 0 var(--c),
          0 0 0 var(--c),
          calc(var(--size) * -1) calc(var(--size) * -1) 0 color-mix(in oklab, var(--c) 45%, transparent),
          var(--size) calc(var(--size) * -1) 0 color-mix(in oklab, var(--c) 45%, transparent),
          calc(var(--size) * -1) var(--size) 0 color-mix(in oklab, var(--c) 45%, transparent),
          var(--size) var(--size) 0 color-mix(in oklab, var(--c) 45%, transparent);
      }

      .boot-spark.boot-diamond {
        box-shadow:
          0 calc(var(--size) * -2) 0 var(--c),
          0 calc(var(--size) * 2) 0 var(--c),
          calc(var(--size) * -2) 0 0 var(--c),
          calc(var(--size) * 2) 0 0 var(--c),
          0 calc(var(--size) * -1) 0 var(--c),
          0 var(--size) 0 var(--c),
          calc(var(--size) * -1) 0 0 var(--c),
          var(--size) 0 0 var(--c),
          0 0 0 #fff;
      }

      .boot-spark.boot-dot {
        background: var(--c);
        border-radius: 50%;
        box-shadow: 0 0 6px var(--c), 0 0 2px #fff;
      }

      .boot-spark.boot-glow {
        background: var(--c);
        border-radius: 50%;
        box-shadow: 0 0 12px var(--c), 0 0 4px var(--c), 0 0 2px #fff;
        filter: blur(1px);
      }

      .boot-spark.boot-plus {
        box-shadow:
          0 calc(var(--size) * -1) 0 var(--c),
          0 var(--size) 0 var(--c),
          calc(var(--size) * -1) 0 0 var(--c),
          var(--size) 0 0 var(--c),
          0 0 0 var(--c);
      }

      @keyframes boot-sparkles-glow-pulse {
        0%,
        100% {
          opacity: 0.63;
        }
        50% {
          opacity: 0.9;
        }
      }

      @keyframes boot-sparkles-rise {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) scale(0.3);
        }
        10% {
          opacity: 1;
          transform: translate3d(0, calc(var(--rise, 256px) * -0.05), 0)
            scale(1);
        }
        50% {
          opacity: 1;
          transform: translate3d(
              var(--sway),
              calc(var(--rise, 256px) * -0.5),
              0
            )
            scale(1);
        }
        85% {
          opacity: 0.55;
          transform: translate3d(
              calc(var(--sway) * -0.4),
              calc(var(--rise, 256px) * -0.9),
              0
            )
            scale(0.8);
        }
        100% {
          opacity: 0;
          transform: translate3d(
              calc(var(--sway) * -0.8),
              calc(var(--rise, 256px) * -1.05),
              0
            )
            scale(0.2);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-loading .boot-spark, .boot-loading .boot-sparkles-field::after { animation: none; }
      }
    </style>
    <script type="module" src="/src/boot-theme.ts"></script>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <!-- Static loading screen - kept outside React to avoid a blank mount handoff -->
    <div class="boot-loading" data-state="loading" role="status" aria-label="Loading Cly">
      <div class="boot-logo-wrap">
        <div class="boot-sparkles-wrap">
          <div class="boot-sparkles-field" aria-hidden="true"></div>
          <div class="boot-sparkles-child">
            <svg class="boot-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-hidden="true">
              <g fill="none" stroke="currentColor" stroke-width="10" stroke-linecap="butt" stroke-linejoin="miter">
                <path d="M48 28h-5a24 24 0 1 0 5 47"></path>
                <path d="M50 14v39l17 17"></path>
                <path d="M67 70 87 39M67 70C61 81 55 86 42 86"></path>
              </g>
            </svg>
          </div>
        </div>
      </div>
      <div class="boot-copy">
        <p class="boot-message">Loading your local research workspace…</p>
        <button class="boot-retry" type="button">Retry</button>
      </div>
    </div>
    <script type="module" src="/src/boot-loading.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
